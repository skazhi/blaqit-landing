<!doctype html>
<html lang="ru" translate="no">
  <head>
    <meta charset="UTF-8" />
    <!-- Отключаем автоперевод Chrome: страница на русском, но lang="en" (старое
         значение) сбивало детектор языка, и Chrome то предлагал перевод, то нет —
         при каждом переключении вёрстка «прыгала» (переведённый текст короче/длиннее). -->
    <meta name="google" content="notranslate" />
    <!-- Content-Security-Policy: защита от XSS. script-src без 'unsafe-inline' блокирует
         инъекции вида <img onerror=...>. 'unsafe-eval' + домены Яндекса нужны только
         для Яндекс.Карт на лендинге (карта использует eval); инлайн-инъекции это НЕ
         открывает. style-src 'unsafe-inline' — из-за инлайн-стилей приложения и заставки.
         Примечание: frame-ancestors (антиклик­джекинг) через <meta> не действует —
         это отдельный заголовок на nginx (бэклог). -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-eval' https://api-maps.yandex.ru https://yastatic.net https://*.maps.yandex.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://api-maps.yandex.ru https://*.maps.yandex.net https://*.yandex.net https://yastatic.net; worker-src 'self' blob:" />
    <!-- Telegram Mini App SDK: свой хостинг (не telegram.org) + async — ноль внешних зависимостей при загрузке. -->
    <script async src="/demo/telegram-web-app.js"></script>
    <link rel="icon" type="image/svg+xml" href="/demo/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: установка на телефон и быстрый запуск -->
    <link rel="manifest" href="/demo/manifest.webmanifest" />
    <meta name="theme-color" content="#0B0E14" />
    <link rel="apple-touch-icon" href="/demo/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="blaqit" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Google-шрифты убраны намеренно: на плохой мобильной сети запрос к fonts.googleapis.com
         мог висеть минутами и блокировать загрузку. Используем системный шрифт (San Francisco на iOS). -->
    <!-- Название продукта. У конкретной сети оно подменяется на её собственное
         через window.__BRAND__ / VITE_BRAND_NAME (см. ниже и BRANDING.md). -->
    <title>blaqit.CRM</title>

    <!-- ── БРЕНД ПОД СЕТЬ (необязательно) ──────────────────────────────────────
         Чтобы перекрасить CRM под другую сеть БЕЗ пересборки — раскомментируйте
         и задайте цвет/название. Достаточно одного цвета accent (hover и подложка
         выведутся автоматически). Для тёмного бренда добавьте accentContrast:"#fff".
         Логотип меняется заменой файла public/logo.svg.
      <script>
        window.__BRAND__ = {
          name: "Название сети",
          accent: "#2f6df6"
          // accentContrast: "#ffffff"
        };
      </script>
      ───────────────────────────────────────────────────────────────────────── -->

    <style>
      /* Заставка на время загрузки приложения — вместо белого экрана */
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        background: #0B0E14; z-index: 0; }
      #boot .ring { width: 42px; height: 42px; border-radius: 50%;
        border: 3px solid rgba(220,174,76,0.25); border-top-color: #dcae4c; animation: bootspin 0.8s linear infinite; }
      @keyframes bootspin { to { transform: rotate(360deg); } }
    </style>
    <script type="module" crossorigin src="/demo/assets/index-Bcc26Ufo.js"></script>
    <link rel="stylesheet" crossorigin href="/demo/assets/index-DhsN0bZX.css">
  </head>
  <body>
    <div id="root">
      <div id="boot"><div class="ring"></div></div>
    </div>
  </body>
</html>
