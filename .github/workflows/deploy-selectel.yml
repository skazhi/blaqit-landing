name: Деплой на Selectel (российский хостинг)

# Сайт лежал на GitHub Pages — это сервер в США (см. blaqit-crm/docs/DECISIONS.md,
# запись от 31.08.2026 «Убрали все каналы, по которым данные уходили за границу»).
# Эта задача при каждом пуше в main зеркалирует репозиторий в объектное хранилище
# Selectel (Россия), откуда сайт раздаётся через Selectel CDN на домен blaqit.ru.
#
# ── Как всё устроено (настроено 05.09.2026) ────────────────────────────────────
# www.blaqit.ru — сам сайт, отдаётся из бакета blaqit.ru в хранилище Selectel
#   (бакет публичный, домен привязан на вкладке «Домены», сертификат загружен
#   в панель РУКАМИ — автопродления при внешнем DNS у Selectel нет).
# blaqit.ru — редирект на www с нашего сервера в России; там сертификат
#   продлевает certbot сам.
# ⚠️ Не ставьте бакету «политику доступа» через API: она перекрывает служебному
# пользователю всё, кроме чтения файлов, и выкладка начинает падать с
# AccessDenied. Публичность задаётся типом бакета в панели.
# Подробности и причины — docs/DECISIONS.md в blaqit-crm, записи от 05.09.2026.
#
# ── Что нужно один раз в этом репозитории ──────────────────────────────────────
# Секреты (Settings → Secrets and variables → Actions):
#   SELECTEL_S3_ACCESS_KEY, SELECTEL_S3_SECRET_KEY
# Значения — в файле .env.selectel в репозитории blaqit-crm (у разработчиков).
#
# Пока секретов нет, задача честно пишет об этом в лог и завершается успехом —
# красный CI на пустом месте хуже пропущенной выкладки.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-selectel
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установить boto3
        run: pip install --quiet boto3

      # Выкладку делает свой скрипт, а не `aws s3 sync`: штатный AWS CLI
      # рассчитан на настоящий S3 и на сторонних хранилищах спотыкается
      # (контрольные суммы, адресация при имени бакета с точкой). Первая же
      # попытка выкатки на нём и упала. Скрипт проверяется локально —
      # `python deploy_to_selectel.py --dry-run`.
      - name: Выложить сайт в Selectel
        id: deploy
        env:
          SELECTEL_S3_ACCESS_KEY: ${{ secrets.SELECTEL_S3_ACCESS_KEY }}
          SELECTEL_S3_SECRET_KEY: ${{ secrets.SELECTEL_S3_SECRET_KEY }}
        run: |
          set -e
          if [ -z "$SELECTEL_S3_ACCESS_KEY" ]; then
            echo "::notice::Секреты SELECTEL_S3_ACCESS_KEY/SELECTEL_S3_SECRET_KEY не заданы — сайт не выложен."
            echo "Как настроить — в шапке .github/workflows/deploy-selectel.yml."
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python deploy_to_selectel.py

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Сайт обновлён в объектном хранилище Selectel (bucket blaqit.ru)."

      # Проверка на ЖИВОМ адресе, а не на файле в репозитории. Выкладка может
      # пройти успешно, а посетитель увидеть старую страницу: между хранилищем и
      # браузером стоит кэш. Сверяем редакцию политики: в репозитории и на сайте
      # она обязана совпадать.
      #
      # Ждём 7 минут, и это не «на глаз»: страницам при заливке задаётся
      # `max-age=300` (см. cache_control в deploy_to_selectel.py; менять только
      # парой), то есть узел кэша честно держит прежнюю копию до 5 минут. Первая
      # версия проверки ждала 2,5 минуты и падала на ровном месте: 11.09.2026
      # blaqit.ru уже отдавал свежую политику, а www ещё старую. Дольше семи
      # минут — это уже не кэш, а непрошедшая выкладка, и её надо видеть красным.
      #
      # Адрес считается проверенным только после ТРЁХ одинаковых свежих ответов
      # подряд. Узлов кэша несколько, и каждый запрос попадает на любой из них:
      # один удачный ответ означает, что обновился один узел, а не что все
      # посетители видят новую страницу. 11.09.2026 через три часа после
      # выкладки пять ответов из шести были свежими, а шестой — вчерашним.
      # Устаревший ответ обнуляет счёт.
      - name: Проверить, что сайт живой и отдаёт свежую политику
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          set -e
          VERSION=$(grep -o 'Редакция [0-9.]* от [0-9.]*' privacy/index.html | head -1)
          echo "В репозитории: $VERSION"

          WAIT_SECONDS=420   # 5 минут кэша (см. cache_control) + запас на три ответа подряд
          NEED_IN_A_ROW=3    # сколько одинаковых свежих ответов подряд нужно
          PAUSE=10           # пауза между запросами, секунд

          for url in https://blaqit.ru/privacy https://www.blaqit.ru/privacy; do
            ok=""
            streak=0
            last_hash=""
            deadline=$((SECONDS + WAIT_SECONDS))
            while [ "$SECONDS" -lt "$deadline" ]; do
              # Страница сначала скачивается целиком, и только потом ищется
              # строка: при `curl | grep -q` grep закрывает трубу на первом же
              # совпадении, и curl честно пишет в лог «Failure writing output»
              # рядом со словом «ok». Читать такой лог невозможно.
              page=$(curl -fsSL --max-time 20 "$url" || true)
              hash=$(printf '%s' "$page" | sha256sum | cut -d' ' -f1)
              if printf '%s' "$page" | grep -qF "$VERSION"; then
                # Свежий ответ засчитывается, только если совпал с предыдущим
                # байт в байт — иначе счёт начинается заново с единицы.
                if [ "$hash" = "$last_hash" ]; then
                  streak=$((streak + 1))
                else
                  streak=1
                fi
                echo "  [свежая] $url — $streak из $NEED_IN_A_ROW подряд"
              else
                streak=0
                served=$(printf '%s' "$page" | grep -o 'Редакция [0-9.]* от [0-9.]*' | head -1)
                echo "  [ждём]   $url — ${served:-нет ответа}"
              fi
              last_hash=$hash
              if [ "$streak" -ge "$NEED_IN_A_ROW" ]; then
                echo "  [ok] $url — $VERSION"
                ok="да"
                break
              fi
              sleep "$PAUSE"
            done
            if [ -z "$ok" ]; then
              echo "::error::$url не отдаёт «$VERSION» устойчиво за $((WAIT_SECONDS / 60)) минут — страница недоступна или кэш не обновился."
              exit 1
            fi
          done

          echo "::notice::Политика на живом сайте: $VERSION (проверено и без www, и с www, по $NEED_IN_A_ROW ответа подряд)."
